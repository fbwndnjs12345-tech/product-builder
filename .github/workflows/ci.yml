name: Validate Node.js syntax and tests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Check server syntax
        run: node --check server.js
      - name: Check browser script syntax
        run: |
          node --check public/admin.js
          node --check public/claim.js
      - name: Check network enforcement module and tests
        run: |
          node --check lib/network-enforcement.js
          node --check test/network-enforcement.test.js
      - name: Run tests
        run: npm test
